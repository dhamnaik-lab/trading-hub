name: English localization residual-string inventory

on:
  pull_request:
    paths:
      - "src/**/*.cs"
      - "tests/**/*.cs"
      - "tools/audit_spanish_literals.py"
      - ".github/workflows/english-literal-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spanish-string-inventory:
    name: Inventory candidate Spanish literals (read-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan C# display strings
        run: python3 tools/audit_spanish_literals.py --output residual-spanish-literals.json
      - name: Upload inspected inventory
        uses: actions/upload-artifact@v4
        with:
          name: residual-spanish-literals-inventory
          path: residual-spanish-literals.json
          retention-days: 30
