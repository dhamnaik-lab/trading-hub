name: English fork Windows installer verification

on:
  pull_request:
    paths:
      - "build-windows.ps1"
      - "installer/**"
      - "src/**"
      - "Directory.Build.props"
      - ".github/workflows/english-windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    name: Build x64 and ARM64 installers, verify x64 install/uninstall
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      TRADINGHUB_SLEEP_GUARD: off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install NSIS if missing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path -LiteralPath $nsis)) {
            choco install nsis --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw "Could not install NSIS ($LASTEXITCODE)" }
          }
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path -LiteralPath $nsis)) { throw "NSIS not found" }
      - name: Build fork installers from this exact commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./build-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows installer build failed ($LASTEXITCODE)" }
          foreach ($arch in @('x64', 'arm64')) {
            $installer = "dist/TradingHub-Setup-$arch.exe"
            $app = "dist/win-$arch/TradingHub.exe"
            if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Missing $installer" }
            if (-not (Test-Path -LiteralPath $app -PathType Leaf)) { throw "Missing $app" }
            if ((Get-Item -LiteralPath $installer).Length -lt 102400) { throw "Installer too small: $installer" }
          }
      - name: Silent x64 install, file parity and uninstall on disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path 'dist/TradingHub-Setup-x64.exe').Path
          $original = (Resolve-Path 'dist/win-x64/TradingHub.exe').Path
          $installed = Join-Path $env:LOCALAPPDATA 'Programs/Trading Hub'
          $app = Join-Path $installed 'TradingHub.exe'
          $uninstaller = Join-Path $installed 'Desinstalar Trading Hub.exe'
          $userData = Join-Path $env:APPDATA 'Trading Hub'
          $sentinel = Join-Path $userData 'phase9-ci-sentinel.txt'
          if (Test-Path -LiteralPath $installed) { throw "Unexpected existing installation on clean CI runner" }
          New-Item -ItemType Directory -Path $userData -Force | Out-Null
          Set-Content -LiteralPath $sentinel -Value 'installer-must-preserve-user-data' -Encoding utf8
          $p = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent install failed: $($p.ExitCode)" }
          if (-not (Test-Path -LiteralPath $app)) { throw 'Installed application executable missing' }
          if (-not (Test-Path -LiteralPath $uninstaller)) { throw 'Uninstaller missing' }
          $expected = (Get-FileHash -LiteralPath $original -Algorithm SHA256).Hash
          $actual = (Get-FileHash -LiteralPath $app -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'Installed executable does not match published x64 executable' }
          $reg = Get-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\TradingHub' -ErrorAction Stop
          if ($reg.DisplayName -ne 'Trading Hub') { throw 'Uninstall registry entry incorrect' }
          $p = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Silent uninstall failed: $($p.ExitCode)" }
          if (Test-Path -LiteralPath $app) { throw 'Executable remained after uninstall' }
          if ((Get-Content -LiteralPath $sentinel -Raw).Trim() -ne 'installer-must-preserve-user-data') {
            throw 'User data was modified or removed by installation/uninstallation'
          }
          Write-Host 'PASS: isolated silent x64 install, file SHA-256 parity, registry, uninstall and user-data preservation'
      - name: Save SHA-256 manifest for both architectures
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hashes = @('x64', 'arm64') | ForEach-Object {
            $arch = $_
            $installer = "dist/TradingHub-Setup-$arch.exe"
            [ordered]@{
              file = "TradingHub-Setup-$arch.exe"
              architecture = $arch
              sha256 = (Get-FileHash $installer -Algorithm SHA256).Hash
              bytes = (Get-Item $installer).Length
              commit = $env:GITHUB_SHA
            }
          }
          $hashes | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath 'dist/installer-sha256.json' -Encoding utf8
          Get-Content 'dist/installer-sha256.json'
      - name: Upload fork installer evidence (not a published release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: english-fork-windows-installers
          path: |
            dist/TradingHub-Setup-x64.exe
            dist/TradingHub-Setup-arm64.exe
            dist/installer-sha256.json
          retention-days: 14
          if-no-files-found: error
